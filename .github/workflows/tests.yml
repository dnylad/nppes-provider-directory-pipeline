name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Tests create only synthetic ZIP, Parquet, and metadata fixtures in
      # pytest temporary directories; no raw or generated project data is used.
      - name: Run synthetic test suite
        run: pytest tests
